id: kc-struct-shared-005
name: Declared iteration contract (promise markers, maxIterations) matches spec
priority: P1
description: 'Knowledge discovery is progressive and may span sessions. kc therefore uses the
  shared bounded iteration contract (maxIterations: 10, COMPLETE/BLOCKED/CONFUSED promises) with
  Knowledge-specific validation rules.'
type: structural
source:
  type: file
  path: .claude/agents/kc.md
assertions:
- type: regex
  pattern: maxIterations:\s*10\b
  description: maxIterations is declared as 10
- type: contains
  value: '"<promise>COMPLETE</promise>"'
  description: COMPLETE promise marker is declared
- type: contains
  value: '"<promise>BLOCKED</promise>"'
  description: BLOCKED promise marker is declared
- type: contains
  value: '"<promise>CONFUSED</promise>"'
  description: CONFUSED promise marker is declared
