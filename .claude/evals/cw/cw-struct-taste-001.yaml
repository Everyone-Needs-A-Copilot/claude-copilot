id: cw-struct-taste-001
name: Read-before-draft taste step, Taste line and keep/kill offer are intact
priority: P0
description: Taste references phase 2. The step must keep its silent skip, the two-call cap, the agent id and domain set, the data-not-instructions and never-open-sources clauses, the rule (b) yield and the verbatim-words verdict offer. Structural only; it does not claim model behavior.
type: structural
source:
  type: file
  path: .claude/agents/cw.md
assertions:
- type: contains
  value: "Empty output means the personal tier is unset or missing: the step is over and leaves no trace"
  description: "Located only through the personal-tier variable, silent skip"
- type: contains
  value: "--for-agent cw --applies \"project:$(basename \"$(git rev-parse --show-toplevel)\")\""
  description: "Calls find as this agent, scoped to the project"
- type: contains
  value: "--domain <copy|naming|narrative>"
  description: "Own domain set only"
- type: contains
  value: "Run it at most twice"
  description: "Call cap"
- type: contains
  value: "never open a `source` or touch Karakeep"
  description: "Sources and Karakeep are off limits"
- type: contains
  value: "yields on conflict (rule (b))"
  description: "Brand and project authority outrank a reference"
- type: contains
  value: "--why \"<his exact words>\""
  description: "Verdict capture uses the owner's verbatim words"
- type: contains
  value: "only after an explicit yes"
  description: "Nothing is written before confirmation"
- type: contains
  value: "--recorded-by session:cw"
  description: "Provenance of the verdict card"
- type: contains
  value: "--origin agent --agent cw --project"
  description: "The verdict offer records the drafting agent's own id"
- type: contains
  value: "no `Taste:` line, no keep/kill offer, no mention of `TASTE.md`, the personal tier or anything skipped, unset, empty or missing, in the reply, work product, process record or any file"
  description: "A skipped step leaves no trace in any output"
- type: contains
  value: "copy that string verbatim as its own line of your final reply, in the reply itself and not only in a file or work product, never reworded or extended"
  description: "The Taste line is copied from find's taste_line, never composed"
- type: contains
  value: "display this exact command with his exact words, then ask; run it only after an explicit yes:"
  description: "The exact command is shown before the owner is asked"
- type: contains
  value: "never with `--lens`, never a literal path"
  description: "The script is invoked only through the environment variable"
- type: contains
  value: "eval \"$(cc env)\"; if [ -x \"$CC_PERSONAL_KNOWLEDGE_REPO/scripts/taste\" ]; then \"$CC_PERSONAL_KNOWLEDGE_REPO/scripts/taste\" ref find"
  description: "Env load, guard and find are one command in one shell"
- type: contains
  value: "|| echo \"Taste: none (find-failed: $?)\"; fi"
  description: "The command prints its own find-failed line"
- type: contains
  value: "never split across calls, never piped, never with `cc env` loaded in another call"
  description: "The one-shell rule is stated on the step"
- type: contains
  value: "Always run it: only its empty output means the tier is unset, never your own look at the environment."
  description: "The agent never decides the tier is unset itself"
