name: Conformance ownership audit (manual)

# Portable World-A fixtures and the committed known-bad baseline execute once
# in pytest-suites.yml's cc-tests directory sweep. That workflow retains the
# exact former conformance check name and fails it unless its owner succeeds.
# The complete fitness gate remains separate in smoke-tests.yml. World-B machine
# tests remain explicit local checks: no synthetic fleet substitutes for them.
#
# This optional audit checks CI ownership only, not conformance behavior. Keeping
# it manual prevents the former duplicate Linux conformance pytest run. No remote
# branch-protection/workflow-identity policy change is implied by this migration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-audit:
    name: Conformance ownership structure (not behavioral verification)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Check ownership and failure propagation
        run: python -m pytest tests/test_verification_ci.py -q
