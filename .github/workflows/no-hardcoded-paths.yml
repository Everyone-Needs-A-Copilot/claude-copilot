name: No Hardcoded Paths

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-hardcoded-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for hardcoded user paths
        run: bash scripts/check-no-hardcoded-paths.sh
