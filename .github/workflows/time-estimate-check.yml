name: Time Estimate Language Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  select-paths:
    name: Select Time Estimate Language paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      applicable: ${{ steps.paths.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select the original workflow paths
        id: paths
        env:
          CSE_EVENT: ${{ github.event_name }}
          CSE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CSE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CSE_BASE" =~ ^[0-9a-f]{40}$ && "$CSE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CSE_HEAD^{commit}"
          if [[ "$CSE_EVENT" == push && "$CSE_BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "New branch: conservatively require the language scan."
            echo "applicable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$CSE_BASE^{commit}"
          case "$CSE_EVENT" in
            pull_request) CSE_BASE="$(git merge-base "$CSE_BASE" "$CSE_HEAD")" ;;
            push) ;;
            *) echo "Unsupported event: $CSE_EVENT" >&2; exit 1 ;;
          esac
          # Same include patterns as the former workflow-level paths filter.
          difference=0
          git diff --quiet "$CSE_BASE" "$CSE_HEAD" -- \
            ':(glob).claude/agents/**/*.md' ':(glob).claude/commands/**/*.md' \
            ':(glob)templates/**/*.md' || difference=$?
          case "$difference" in
            0) echo "applicable=false" >> "$GITHUB_OUTPUT"; echo "No matching paths: language scan is not applicable." ;;
            1) echo "applicable=true" >> "$GITHUB_OUTPUT"; echo "Matching paths: language scan is required." ;;
            *) echo "Path comparison failed ($difference)." >&2; exit 1 ;;
          esac

  check-time-language:
    needs: select-paths
    if: needs.select-paths.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    name: Check for time estimate violations

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan agent files for time estimates
        run: |
          echo "Scanning agent templates for time estimate language..."

          VIOLATIONS_FOUND=0

          # Function to check files
          check_pattern() {
            local pattern="$1"
            local description="$2"
            local exclude="${3:-^$}"

            echo ""
            echo "Checking for: $description"

            if find .claude/agents .claude/commands templates -type f -name "*.md" 2>/dev/null \
               | grep -v '/_archive/' \
               | xargs grep -nE "$pattern" 2>/dev/null \
               | grep -vE "$exclude"; then
              echo "❌ VIOLATION: $description found"
              VIOLATIONS_FOUND=1
              return 1
            else
              echo "✓ No violations found"
              return 0
            fi
          }

          # Run all checks
          check_pattern '\b(hours?|days?|weeks?|months?|years?)\b' \
            'Direct time units' \
            'TTL|cache|testing|fast|slow|millisecond|performance|NEVER include|tax year|fiscal year|prior year|last year|this year|day forecast|day projections|ten years|long-lasting'

          check_pattern '\b(timeline|schedule|deadline|due\s+date|ETA|delivery\s+date)\b' \
            'Time-based planning language' \
            'tax|fiscal|quarterly|calendar|CPA|deadline risk|deadline alert'

          check_pattern 'Phase\s+\d+.*\((Week|Month|Q\d)' \
            'Time-based phase descriptions'

          check_pattern '(Response\s+Time|Completion\s+Time|Timeframe)\s*\|' \
            'Tables with time commitments'

          # Exit if violations found
          if [ $VIOLATIONS_FOUND -eq 1 ]; then
            echo ""
            echo "========================================="
            echo "CHECK FAILED: Time estimate violations"
            echo "========================================="
            echo ""
            echo "Agent files should not contain time estimates."
            echo ""
            echo "Common fixes:"
            echo "  • Replace 'timeline' → 'sequence' or 'dependencies'"
            echo "  • Replace 'Response Time' → 'Priority Level'"
            echo "  • Remove time durations from phases"
            echo ""
            echo "See: docs/qa/time-estimate-audit-report.md"
            exit 1
          fi

          echo ""
          echo "✅ All checks passed - no time estimate violations"

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Time Estimate Language Detected

            This PR contains time-based language in agent templates, which violates our design principle of avoiding time estimates.

            **Common violations:**
            - Direct time units: hours, days, weeks, months
            - Planning language: timeline, schedule, deadline, ETA
            - Time-based phases: "Phase 1 (Week 1)"
            - Time commitment tables: "Response Time" columns

            **How to fix:**
            - Replace with dependency-based language
            - Use priority/severity instead of time
            - Describe sequence, not duration

            **Reference:** See \`docs/qa/time-estimate-audit-report.md\` for detailed patterns and examples.
            `
            })

  time-language-gate:
    name: Time Estimate Language gate
    needs: [select-paths, check-time-language]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require a successful applicable scan or proven irrelevance
        env:
          SELECTOR_RESULT: ${{ needs.select-paths.result }}
          APPLICABLE: ${{ needs.select-paths.outputs.applicable }}
          SUITE_RESULT: ${{ needs.check-time-language.result }}
        run: |
          set -euo pipefail
          test "$SELECTOR_RESULT" = success
          case "$APPLICABLE:$SUITE_RESULT" in
            true:success) echo "Applicable language scan passed." ;;
            false:skipped) echo "Language scan explicitly not applicable to this change." ;;
            *) echo "Language scan incomplete: applicable=$APPLICABLE result=$SUITE_RESULT" >&2; exit 1 ;;
          esac
