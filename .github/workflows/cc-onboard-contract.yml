name: cc Onboard Contract

on:
  pull_request:
    branches:
      - main
      - feat/adopt-and-project-setup
  push:
    branches:
      - main
      - feat/adopt-and-project-setup

jobs:
  select-paths:
    name: Select cc Onboard Contract paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      applicable: ${{ steps.paths.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select the original workflow paths
        id: paths
        env:
          CSE_EVENT: ${{ github.event_name }}
          CSE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CSE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CSE_BASE" =~ ^[0-9a-f]{40}$ && "$CSE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CSE_HEAD^{commit}"
          if [[ "$CSE_EVENT" == push && "$CSE_BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo "New branch: conservatively require the contract suite."
            echo "applicable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$CSE_BASE^{commit}"
          case "$CSE_EVENT" in
            pull_request) CSE_BASE="$(git merge-base "$CSE_BASE" "$CSE_HEAD")" ;;
            push) ;;
            *) echo "Unsupported event: $CSE_EVENT" >&2; exit 1 ;;
          esac
          # Same include patterns as the former workflow-level paths filter.
          difference=0
          git diff --quiet "$CSE_BASE" "$CSE_HEAD" -- \
            '.github/workflows/cc-onboard-contract.yml' \
            'scripts/package-cc-macos-release.sh' \
            ':(glob)tools/cc/**' ':(glob)tools/tc/**' || difference=$?
          case "$difference" in
            0) echo "applicable=false" >> "$GITHUB_OUTPUT"; echo "No matching paths: contract suite is not applicable." ;;
            1) echo "applicable=true" >> "$GITHUB_OUTPUT"; echo "Matching paths: contract suite is required." ;;
            *) echo "Path comparison failed ($difference)." >&2; exit 1 ;;
          esac

  onboard-contract:
    needs: select-paths
    if: needs.select-paths.outputs.applicable == 'true'
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/cc/pyproject.toml
            tools/tc/pyproject.toml

      - name: Install contract dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -e "./tools/tc" \
            -e "./tools/cc[dev]"

      - name: Validate release gate syntax
        run: bash -n scripts/package-cc-macos-release.sh

      - name: Test GUI-safe onboarding contracts
        working-directory: tools/cc
        run: |
          python -m pytest \
            tests/test_executables.py \
            tests/test_onboard_contract.py \
            tests/test_workspaces_contract.py::test_recommendations_use_gui_safe_executable_resolver

      - name: Test Python-owned ecosystem reconciliation
        working-directory: tools/cc
        run: |
          python -m pytest \
            tests/test_machine_assessment.py \
            tests/test_project_reconciliation.py \
            tests/test_project_reconciliation_families.py \
            tests/test_reconciliation_recipes.py \
            tests/test_reconciliation_apply.py \
            tests/test_reconciliation_assistant_fake.py \
            tests/test_reconciliation_assistant_product.py \
            tests/test_reconciliation_assistant_security.py \
            tests/test_reconciliation_assistant_store_security.py \
            tests/test_reconciliation_contract.py \
            tests/test_reconciliation_coordinator.py \
            tests/test_reconciliation_recovery.py \
            tests/test_reconcile_command.py \
            tests/test_reconciliation_transaction_diagnostics.py \
            tests/test_workspace_plan_store.py \
            tests/test_workspace_snapshots.py \
            tests/test_workspace_transaction_containment.py \
            tests/test_workspace_transaction_faults.py \
            tests/test_workspace_transaction_locking.py \
            tests/test_workspace_transaction_recovery.py

  onboard-contract-gate:
    name: cc Onboard Contract gate
    needs: [select-paths, onboard-contract]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require a successful applicable suite or proven irrelevance
        env:
          SELECTOR_RESULT: ${{ needs.select-paths.result }}
          APPLICABLE: ${{ needs.select-paths.outputs.applicable }}
          SUITE_RESULT: ${{ needs.onboard-contract.result }}
        run: |
          set -euo pipefail
          test "$SELECTOR_RESULT" = success
          case "$APPLICABLE:$SUITE_RESULT" in
            true:success) echo "Applicable contract suite passed." ;;
            false:skipped) echo "Contract suite explicitly not applicable to this change." ;;
            *) echo "Contract suite incomplete: applicable=$APPLICABLE result=$SUITE_RESULT" >&2; exit 1 ;;
          esac
