name: Pytest Suites

# Wires every pytest suite in the repo into CI as a whole-directory run
# (never an enumerated file list -- a per-file allowlist in
# cc-onboard-contract.yml is how 76 of 99 tools/cc/tests files went
# uncovered for an extended period). Each job below owns one
# pytest root and runs `pytest <dir>/`, so any new test file dropped into
# an already-covered directory is picked up automatically with zero
# workflow changes.
#
# tools/cc's macOS-specific onboarding/reconciliation contract subset
# still runs separately in cc-onboard-contract.yml; the cc-tests job here
# is the superset that guarantees the other ~76 files execute too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pytest-suites-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-tests:
    name: Root tests/ suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/cc/pyproject.toml
            tools/tc/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest pyyaml jsonschema
          # Root tests import cc/tc modules directly (not via pip install);
          # installing both packages editable keeps import paths real.
          python -m pip install --disable-pip-version-check -e "./tools/cc[dev]" -e "./tools/tc"

      - name: Record hook lock dependencies
        run: |
          bash --version | head -1
          /usr/bin/jq --version
          command -V mkdir
          mkdir --version
          sha256sum "$(command -v mkdir)"
          python - <<'PYLOCK'
          import concurrent.futures, os, pathlib, subprocess, tempfile, threading
          with tempfile.TemporaryDirectory(prefix="mkdir-control-", dir=os.environ["RUNNER_TEMP"]) as root:
              for sample in range(10):
                  target = pathlib.Path(root) / str(sample)
                  barrier = threading.Barrier(4)
                  def attempt(_):
                      barrier.wait()
                      return subprocess.run(["mkdir", str(target)], capture_output=True, text=True).returncode
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                      codes = list(pool.map(attempt, range(4)))
                  print({"sample": sample + 1, "mkdir_returncodes": codes, "reported_admissions": codes.count(0)})
          PYLOCK

      - name: Concurrent budget regression under the CI runtime
        env:
          PYTEST_ADDOPTS: --showlocals -vvv
        run: |
          # Any failing sample fails immediately; this never retries a failure away.
          for sample in {1..10}; do
            echo "Concurrent budget sample ${sample}/10"
            python -m pytest tests/test_force_delegate_budget.py::test_same_session_concurrent_calls_all_record_their_targets -q
          done

      - name: Run root pytest suite
        env:
          PYTEST_ADDOPTS: --showlocals -vvv
        run: |
          # Canonical "run all copilot tests" command per pytest.ini's own
          # header comment -- excludes tests/tui (vendored claude_monitor
          # project with its own coverage-gated pytest config).
          python -m pytest tests/ --ignore=tests/tui -p no:cov

  tc-tests:
    name: tools/tc/tests full suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/tc/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -e "./tools/tc"

      - name: Run tc pytest suite
        working-directory: tools/tc
        run: python -m pytest tests/

  cc-tests:
    name: tools/cc/tests full suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cc/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -e "./tools/cc[dev]" -e "./tools/tc"

      - name: Run full cc pytest suite
        working-directory: tools/cc
        run: |
          # World-B tests intentionally require the developer's configured
          # fleet. This whole-directory run is the single Linux owner of
          # the World-A contract and committed baseline; shared CI must not
          # fabricate a machine fleet for tests marked `machine`.
          python -m pytest tests/ -m "not machine"

  conformance-suite:
    # Preserve the existing required check display name. Do not replace this
    # with an if-success job: GitHub can treat skipped required jobs as passing.
    # Workflow-specific branch rules require a separate remote policy audit.
    name: Conformance harness (World-A fixtures + committed baseline)
    needs: cc-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the portable suite owner to pass
        env:
          CC_TEST_RESULT: ${{ needs.cc-tests.result }}
        run: test "$CC_TEST_RESULT" = success

  skill-test-scripts:
    name: Skill script self-tests (.claude/skills/**/scripts/test_*.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run all skill script tests
        run: python -m pytest .claude/skills -q

  vendored-monitor-tests:
    name: tests/tui suite (vendored claude_monitor package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run tests/tui suite
        run: |
          # This repo's root conftest.py deliberately sets
          # collect_ignore_glob = ["tests/tui/*", ...] so a bare
          # `pytest tests/` run (the "copilot's own tests" sweep above)
          # does not pull in this vendored third-party package's tests.
          # That glob-ignore only applies to *directory* collection, not
          # to explicitly named files, so passing the discovered file
          # list directly still runs the suite while leaving the
          # copilot-tests sweep undisturbed.
          files=$(find tests/tui -maxdepth 1 -type f -name 'test_*.py' | sort)
          echo "$files"
          python -m pytest $files
