
# Ecosystem repo classification -- the taxonomy `cc.core.conformance.classes`
# reads to decide which rubric dimensions apply to which directory under
# the configured `projects.roots` fleet.
#
# THIS FILE IS DATA. A class call is a classification.toml edit, never a
# code change (HARNESS-DESIGN.md Layer 3: "encoded as a committed
# classification.toml override table with a one-line rationale per entry").
#
# Provenance: seeded verbatim from CLASSIFICATION.md's 2026-08-10 audit (76
# scanned directories; `COPILOT/shared-docs` is a symlink to
# `knowledge-copilot-internal`, not a distinct directory, so the audit seeded
# 75 real rows). The subsequently discovered public app repo adds one reviewed
# row below, for 76 current entries. The table is further corrected by the
# owner's ratified answers in
# `copilot-control-tower/docs/ecosystem-audit-open-questions.md`:
#   - Q9  (answer B): `copilot-control-tower` reclassified COMPONENT -> PRODUCT
#     (renders/supervises the CLI but is not one of the four synced
#     framework families -- a consumer, rubric class C, not a tier member).
#   - Q27 (11 ambiguous directories): each row below whose rationale cites
#     "Q27" carries the owner's literal answer from that table. The owner's
#     shorthand answer "Content" (given for both `the-collective` and
#     `small-business-copilot`) is read as SITE-CONTENT, matching
#     CLASSIFICATION.md's own class name for that category.
#   - Q2/Q20: PERSONAL is confirmed in scope and maintained (not archived),
#     including the four dormant repos Q20 asks about
#     (`financial-tracker`, `investr-app`, `revenue-projections`,
#     `investr-api` all answered B, "keep receiving framework fan-out and
#     maintenance like an active repo") -- no class change, but they are
#     NOT excluded from the sweep.
#   - PRD-24/TASK-301/WP-838: the separately governed public app repository
#     discovered after the audit is explicitly N/A for framework conformance
#     while all macOS app work is deferred; it remains visible to discovery.
#
# `class` is one of: COMPONENT, PRODUCT, SITE-CONTENT, DOCS-KNOWLEDGE,
# SCRATCH-ARCHIVE (`classes.RepoClass`).
#
# `role` is set ONLY for `class = "COMPONENT"` entries that are one of the
# four synced framework families' tier rungs (`foundation` / `organization`
# / `department` / `personal`) -- it is what lets `classes.py` tell a
# tier-A (foundation) repo from a tier-B (org/dept/personal) repo for the
# rubric's A/B split, without re-parsing `copilot.layers.yml` here.
# `product-creation-copilot` is `class = "COMPONENT"` with NO `role` (Q27:
# the owner calls it a component/foundational tool, but it is not one of
# the four synced families and has no manifest layer entry -- see its own
# rationale below) -- `classes.py` treats a role-less COMPONENT as rubric
# class C, the same "renders/supervises but does not participate in the
# inheritance ladder" reasoning as Q9's `copilot-control-tower` call.
#
# `path` is `<group>/<name>` relative to the scanned root (e.g.
# the configured fleet root) -- the same two-level grouping CLASSIFICATION.md
# itself uses (`COPILOT`, `PERSONAL`, `TSM`).

schema_version = 1

